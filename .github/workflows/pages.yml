# Pubblica l'app su GitHub Pages a ogni push su main (o a mano da Actions → "Pubblica su GitHub Pages").
# Pubblica SOLO i file dell'app: niente test, strumenti, appunti di progetto o Markdown.
# I dati sanitari non sono nel repository (vedi .gitignore) e quindi non possono finire qui.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # il confronto con l'Excel si salta da solo: i dati reali non sono nel repository
      - name: Test
        run: node --test
      - name: Copia solo i file dell'app
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js css js vendor icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  pubblica:
    needs: prepara
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - id: pubblicazione
        uses: actions/deploy-pages@v4
